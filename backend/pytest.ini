[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    # starlette.testclient itself emits deprecations on import (httpx, anyio
    # aliases); they are third-party code paths, not ours.
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    ignore:The anyio.abc.BlockingPortal alias is deprecated
